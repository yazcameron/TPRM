<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --line: #e4e4e4;
      --bg: #fff;
      --high: #8b1e1e;
      --medium: #8a5a00;
      --low: #1f5c3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 58rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.25rem; }
    h2 { font-size: 1.05rem; font-weight: 600; margin: 2rem 0 0.75rem; border-bottom: 1px solid var(--line); padding-bottom: 0.35rem; }
    .meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .intro { margin: 0 0 1.5rem; }
    ol.questions { padding-left: 1.25rem; margin: 0; }
    ol.questions li { margin-bottom: 1.25rem; }
    .section { font-size: 0.8rem; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem; }
    .q { margin: 0 0 0.25rem; }
    .expect { font-size: 0.875rem; color: var(--muted); }
    dl { margin: 0; }
    dt { font-size: 0.8rem; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); margin-top: 0.9rem; }
    dd { margin: 0.2rem 0 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--line); }
    th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); font-weight: 600; }
    .level-High { color: var(--high); font-weight: 600; }
    .level-Medium { color: var(--medium); font-weight: 600; }
    .level-Low { color: var(--low); font-weight: 600; }
    .tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 0 0 1.5rem; }
    .tab-bar button {
      appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
      color: var(--muted); cursor: pointer; font: inherit; font-weight: 600;
      margin-bottom: -1px; padding: 0.55rem 0.9rem;
    }
    .tab-bar button.active { color: var(--text); border-bottom-color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    footer {
      max-width: 58rem;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
{{body}}
  </main>
  <footer>Instacart GRC · TPRM · {{generated}}</footer>
  <script>
    document.querySelectorAll(".tab-bar button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-tab");
        document.querySelectorAll(".tab-bar button").forEach(function (b) { b.classList.toggle("active", b === btn); });
        document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.toggle("active", p.id === id); });
      });
    });
  </script>
</body>
</html>
